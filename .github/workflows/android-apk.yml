name: Build private TrimCheck APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
  - name: Validate Android Manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path("app/src/main/AndroidManifest.xml")
          data = p.read_bytes()
          print("First bytes:", repr(data[:100]))
          ET.fromstring(data)
          print("XML syntax is valid")
          PY

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace --info
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TrimCheck-Android-Demo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
