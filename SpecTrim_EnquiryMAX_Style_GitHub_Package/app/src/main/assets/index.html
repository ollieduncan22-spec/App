<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073c30"><title>SpecTrim | Sales Assist</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--green:#073b2f;--deep:#002b22;--bronze:#a17a4a;--ink:#152624;--muted:#697270;--line:#e4e7e3;--cream:#faf9f6;--white:#fff;--soft:#f2f3f0}*{box-sizing:border-box}body{margin:0;background:var(--cream);font:15px 'Source Sans 3',Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}.layout{display:grid;grid-template-columns:282px minmax(0,1fr);min-height:100vh}.side{background:linear-gradient(160deg,#073d30,#002b23);color:white;display:flex;flex-direction:column;padding:20px 10px;min-height:100vh}.brand{display:flex;align-items:center;gap:15px;padding:4px 16px 28px}.mark{font-size:43px;line-height:1;font-weight:600;letter-spacing:-9px;font-style:italic;padding-right:10px}.brandname{font-size:20px;letter-spacing:7px;font-weight:500}.nav{display:grid;gap:4px}.nav button{border:0;background:none;color:#e5eee9;text-align:left;padding:13px 18px;border-radius:7px;display:flex;align-items:center;gap:14px;font-size:16px}.nav button.active,.nav button:hover{background:#ffffff1b;color:#fff}.nav button.active{border-left:3px solid var(--bronze)}.nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9}.sep{height:1px;background:#ffffff50;margin:23px 12px}.section{font-size:12px;letter-spacing:1.5px;padding:0 19px 12px;color:#c3d4cd}.bottom{margin-top:auto}.main{min-width:0}.top{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:0 30px}.branch{font-weight:700;font-size:18px;white-space:nowrap}.global{max-width:570px;width:100%;margin:auto;position:relative}.global input{width:100%;padding:12px 16px 12px 40px;border:1px solid #d9dfda;border-radius:6px;background:#f7f8f6}.global:before{content:'⌕';position:absolute;left:14px;top:3px;font-size:28px;color:#4e6058}.user{margin-left:auto;white-space:nowrap;display:flex;align-items:center;gap:10px}.avatar{width:35px;height:35px;background:var(--green);color:#fff;border-radius:50%;display:grid;place-items:center;font-weight:700}.user small{display:block;color:var(--muted)}.content{padding:24px;max-width:1640px;margin:auto}.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px}.quick button{background:white;border:1px solid var(--line);border-radius:8px;padding:21px 17px;text-align:left;display:flex;align-items:center;gap:16px;min-height:115px}.quick button:hover{border-color:var(--bronze);box-shadow:0 3px 12px #0000000d}.quick .ico{font-size:35px;color:var(--bronze);min-width:45px;text-align:center}.quick strong{display:block;font-size:18px}.quick small{display:block;color:var(--muted);line-height:1.35;font-size:14px;margin-top:4px}.workspace{display:grid;grid-template-columns:285px minmax(0,1fr);gap:17px}.filters,.results{background:#fff;border:1px solid var(--line);border-radius:8px;min-width:0}.filters{padding:20px;align-self:start}.filters h2{margin:0 0 16px;font-size:21px;display:flex;justify-content:space-between;align-items:center}.link{border:0;background:none;text-decoration:underline;color:var(--green);font-size:13px}.field{margin:0 0 12px}.field label{display:block;margin-bottom:4px;font-size:14px;font-weight:600}.field select,.field input{width:100%;height:37px;border:1px solid #d6ded8;border-radius:5px;background:#fff;padding:5px 10px}.range{display:flex;gap:7px}.primary{background:var(--green);border:0;color:#fff;border-radius:5px;padding:10px 15px;font-weight:700}.primary:hover{background:#0c5946}.wide{width:100%;margin-top:10px}.resulthead{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:0 18px;min-height:52px}.tabs{display:flex;gap:25px;align-self:stretch}.tabs button{border:0;background:none;padding:0 4px;color:#555}.tabs button.active{border-bottom:3px solid var(--green);color:var(--ink);font-weight:700}.sort{display:flex;align-items:center;gap:10px;white-space:nowrap}.sort select{border:1px solid #d9ded9;border-radius:5px;padding:8px;background:#fff}.rows{padding:8px}.vehicle{display:grid;grid-template-columns:22px 140px minmax(0,1fr) 115px 123px;gap:14px;align-items:center;padding:9px 10px;margin-bottom:8px;border:1px solid var(--line);border-radius:7px;min-height:107px}.vehicle img{width:140px;height:88px;object-fit:cover;border-radius:5px;background:#f0f0f0}.vehicle h3{font-size:16px;margin:0 0 5px;line-height:1.2}.meta{color:#66716e;font-size:13px}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.tag{background:#f0f1ef;padding:3px 7px;border-radius:4px;font-size:12px}.price{font-size:19px;font-weight:700}.stock{font-size:13px;color:#15723a}.stock.warn{color:#956418}.place{font-size:12px;color:#66716e;margin-top:5px}.actions{display:grid;grid-template-columns:1fr 33px;gap:7px}.actions .primary{padding:8px 5px;font-size:13px}.star{background:#f8f8f7;border:1px solid var(--line);border-radius:5px;font-size:20px;color:var(--bronze)}.empty{padding:50px 20px;text-align:center;color:var(--muted)}.notice{font-size:13px;color:#6c716d;padding:8px 15px}.pill{border:1px solid #d5dfd9;background:#f6f8f6;color:#355347;border-radius:30px;padding:5px 11px;font-size:12px}.modalback{position:fixed;inset:0;background:#071b17aa;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modalback.show{display:flex}.modal{background:#fff;border-radius:10px;max-width:650px;width:100%;padding:25px;max-height:90vh;overflow:auto}.modal h2{margin-top:0}.modal .close{float:right;border:0;background:none;font-size:25px}.muted{color:var(--muted)}.hide{display:none!important}@media(max-width:1250px){.quick{grid-template-columns:repeat(2,1fr)}.vehicle{grid-template-columns:20px 100px minmax(0,1fr) 100px}.vehicle img{width:100px}.actions{grid-column:3/5;justify-self:end;width:160px}}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{min-height:0;position:relative;padding:8px}.brand{padding:8px}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap;padding:9px}.side .sep,.side .section,.bottom{display:none}.top{height:auto;padding:12px;flex-wrap:wrap}.global{order:3;max-width:none}.content{padding:12px}.workspace{grid-template-columns:1fr}.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.filters h2,.filters .wide{grid-column:1/-1}.vehicle{grid-template-columns:20px 90px minmax(0,1fr)}.vehicle img{width:90px}.pricebox{grid-column:3}.actions{grid-column:3}.resulthead{flex-wrap:wrap;padding:10px}}@media(max-width:520px){.quick{grid-template-columns:1fr 1fr;gap:8px}.quick button{padding:10px;min-height:105px;display:block}.quick .ico{font-size:25px;text-align:left}.quick strong{font-size:15px}.quick small{font-size:12px}.filters{grid-template-columns:1fr 1fr}.vehicle{gap:7px;padding:7px;grid-template-columns:18px 80px minmax(0,1fr)}.vehicle img{width:80px;height:75px}.vehicle h3{font-size:14px}.tags{display:none}.meta{font-size:11px}.price{font-size:16px}.actions{width:145px}.branch{font-size:15px}.user{font-size:12px}}
</style></head><body><div class="layout"><aside class="side"><div class="brand"><span class="mark">SF</span><span class="brandname">SPECTRIM</span></div><nav class="nav" id="nav"><button data-mode="all" class="active">⌂ &nbsp; Sales Assist</button><button data-mode="features">☷ &nbsp; Find by Features</button><button data-mode="model">▣ &nbsp; Find by Model</button><button data-mode="stock">⌕ &nbsp; Search Stock</button></nav><div class="sep"></div><nav class="nav"><button data-mode="saved">☆ &nbsp; Saved Searches</button><button data-mode="recent">◷ &nbsp; Recently Viewed</button></nav><div class="sep"></div><div class="section">MANAGEMENT</div><nav class="nav"><button id="importLink">⇧ &nbsp; Import Stock</button><button data-mode="stock">▤ &nbsp; Stock Overview</button><button id="specLink">▤ &nbsp; Vehicle Specs</button><button id="ownerLink">⚙ &nbsp; Owner Portal</button></nav><nav class="nav bottom"><button id="helpLink">ⓘ &nbsp; Help & Support</button></nav></aside><div class="main"><header class="top"><div class="branch">Dealership Workspace ▾</div><div class="global"><input id="search" placeholder="Search stock by make, model, trim or registration…" aria-label="Search vehicles"></div><div class="user"><div class="avatar">S</div><div>SpecTrim <small>Sales Assist</small></div></div></header><main class="content"><div class="quick"><button data-mode="features"><span class="ico">⌕</span><span><strong>Find by Features</strong><small>Select the features your customer needs.</small></span></button><button data-mode="model"><span class="ico">▱</span><span><strong>Find by Model</strong><small>Browse trims and compare specifications.</small></span></button><button data-mode="stock"><span class="ico">▤</span><span><strong>Search Stock</strong><small>Search vehicles across your branch.</small></span></button><button data-mode="saved"><span class="ico">☆</span><span><strong>Saved Searches</strong><small>Quick access to your favourite searches.</small></span></button></div><div class="workspace"><section class="filters"><h2>Filter Vehicles <button class="link" id="clear">Clear all</button></h2><div class="field"><label for="make">Make</label><select id="make"><option value="">Any</option><option>Hyundai</option></select></div><div class="field"><label for="model">Model</label><select id="model"><option value="">Any</option></select></div><div class="field"><label for="trim">Trim</label><select id="trim"><option value="">Any</option></select></div><div class="field"><label for="fuel">Fuel Type</label><select id="fuel"><option value="">Any</option><option>Petrol</option><option>Hybrid</option><option>Electric</option><option>PHEV</option></select></div><div class="field"><label for="trans">Transmission</label><select id="trans"><option value="">Any</option><option>Manual</option><option>Automatic</option></select></div><div class="field"><label>Price Range</label><div class="range"><input id="min" type="number" min="0" placeholder="£ Min"><input id="max" type="number" min="0" placeholder="£ Max"></div></div><div class="field"><label for="year">Year from</label><select id="year"><option value="">Any</option><option>2022</option><option>2023</option><option>2024</option><option>2025</option><option>2026</option></select></div><div class="field"><label for="miles">Max mileage</label><select id="miles"><option value="">Any</option><option value="5000">5,000</option><option value="10000">10,000</option><option value="20000">20,000</option><option value="50000">50,000</option></select></div><div class="field"><label for="feature">Required Feature</label><select id="feature"><option value="">Any</option><option>Heated Seats</option><option>Heated Steering Wheel</option><option>Rear Camera</option><option>V2L</option><option>Sunroof</option><option>Sat Nav</option><option>Apple CarPlay</option></select></div><button class="primary wide" id="apply">Show Results</button></section><section class="results"><div class="resulthead"><div class="tabs"><button id="tabAll" class="active">Vehicles (<span id="count">0</span>)</button><button id="tabCompare">Compare (<span id="compareCount">0</span>)</button><button id="tabSaved">Saved (<span id="savedCount">0</span>)</button></div><div class="sort"><label for="sort">Sort by</label><select id="sort"><option value="low">Price (Low - High)</option><option value="high">Price (High - Low)</option><option value="year">Newest</option><option value="miles">Lowest Mileage</option></select></div></div><div class="notice" id="notice">Showcase data — illustrative vehicles, prices and availability. Not connected to live dealership stock.</div><div class="rows" id="rows"></div></section></div></main></div></div><div class="modalback" id="back"><div class="modal" role="dialog" aria-modal="true"><button class="close" id="close" aria-label="Close">×</button><div id="modalContent"></div></div></div><script>
const vehicles=[{id:1,model:'Bayon',trim:'1.0 T-GDi SE Connect',year:2024,miles:5200,fuel:'Petrol',trans:'Manual',price:17995,features:['Apple CarPlay','Rear Camera','Climate Control','Alloys'],img:'assets/demo-vehicle-1.jpg',status:'In Stock'},{id:2,model:'Kona',trim:'1.6 GDi Hybrid Premium',year:2023,miles:8412,fuel:'Hybrid',trans:'Automatic',price:21995,features:['Heated Seats','Heated Steering Wheel','Rear Camera','Sat Nav'],img:'assets/demo-vehicle-2.jpg',status:'In Stock'},{id:3,model:'Kona',trim:'Electric Ultimate 65kWh',year:2024,miles:3800,fuel:'Electric',trans:'Automatic',price:26495,features:['Heated Seats','Heated Steering Wheel','V2L','Sunroof'],img:'assets/demo-vehicle-3.jpg',status:'In Stock'},{id:4,model:'Tucson',trim:'1.6 T-GDi N Line',year:2023,miles:12100,fuel:'Petrol',trans:'Manual',price:24995,features:['N Line Styling','Rear Camera','Sat Nav','Parking Sensors'],img:'assets/demo-vehicle-4.jpg',status:'In Stock'},{id:5,model:'Santa Fe',trim:'1.6 T-GDi Plug-in Hybrid Premium',year:2023,miles:15200,fuel:'PHEV',trans:'Automatic',price:31995,features:['7 Seats','Heated Seats','360° Camera','Sunroof'],img:'assets/demo-vehicle-1.jpg',status:'Needs Checking'},{id:6,model:'IONIQ 5',trim:'77kWh Ultimate',year:2023,miles:9100,fuel:'Electric',trans:'Automatic',price:32495,features:['Heated Seats','BOSE Audio','Panoramic Roof','V2L'],img:'assets/demo-vehicle-3.jpg',status:'In Stock'}];
const $=id=>document.getElementById(id),money=n=>'£'+n.toLocaleString('en-GB');let mode='all',tab='all',saved=new Set(),compared=new Set(),recent=[];const fields=['make','model','trim','fuel','trans','min','max','year','miles','feature'];function populate(){for(let [id,vals] of [['model',[...new Set(vehicles.map(v=>v.model))]],['trim',[...new Set(vehicles.map(v=>v.trim))]]]){const el=$(id);vals.sort().forEach(v=>el.add(new Option(v,v)))}}function matches(v){let q=$('search').value.toLowerCase();return (!q||('hyundai '+v.model+' '+v.trim+' '+v.year).toLowerCase().includes(q))&&(!$('make').value||$('make').value==='Hyundai')&&(!$('model').value||v.model===$('model').value)&&(!$('trim').value||v.trim===$('trim').value)&&(!$('fuel').value||v.fuel===$('fuel').value)&&(!$('trans').value||v.trans===$('trans').value)&&(!$('min').value||v.price>=Number($('min').value))&&(!$('max').value||v.price<=Number($('max').value))&&(!$('year').value||v.year>=Number($('year').value))&&(!$('miles').value||v.miles<=Number($('miles').value))&&(!$('feature').value||v.features.includes($('feature').value))}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let list=vehicles.filter(matches);if(tab==='saved'||mode==='saved')list=list.filter(v=>saved.has(v.id));if(tab==='compare')list=list.filter(v=>compared.has(v.id));if(mode==='recent')list=list.filter(v=>recent.includes(v.id));const sort=$('sort').value;list.sort((a,b)=>sort==='high'?b.price-a.price:sort==='year'?b.year-a.year:sort==='miles'?a.miles-b.miles:a.price-b.price);$('count').textContent=vehicles.filter(matches).length;$('savedCount').textContent=saved.size;$('compareCount').textContent=compared.size;['All','Saved','Compare'].forEach(t=>$('tab'+t).classList.toggle('active',tab===t.toLowerCase()));$('rows').innerHTML=list.length?list.map(v=>`<article class="vehicle"><input type="checkbox" aria-label="Compare ${escapeHtml(v.model)}" data-compare="${v.id}" ${compared.has(v.id)?'checked':''}><img src="${v.img}" alt="Illustrative vehicle"><div><h3>Hyundai ${escapeHtml(v.model)} ${escapeHtml(v.trim)}</h3><div class="meta">${v.year} (${String(v.year).slice(2)}) &nbsp; | &nbsp; ${v.miles.toLocaleString()} miles &nbsp; | &nbsp; ${v.fuel} &nbsp; | &nbsp; ${v.trans}</div><div class="tags">${v.features.map(f=>`<span class="tag">${escapeHtml(f)}</span>`).join('')}</div></div><div class="pricebox"><div class="price">${money(v.price)}</div><div class="stock ${v.status==='In Stock'?'':'warn'}">● ${v.status}</div><div class="place">⌖ Demo dealership</div></div><div class="actions"><button class="primary" data-view="${v.id}">View Details</button><button class="star" data-save="${v.id}" aria-label="Save vehicle">${saved.has(v.id)?'★':'☆'}</button></div></article>`).join(''):'<div class="empty">No vehicles match these filters. Try clearing a filter.</div>'}function setMode(m){mode=m;tab=m==='saved'?'saved':'all';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));if(m==='features')$('feature').focus();if(m==='model')$('model').focus();if(m==='stock')$('search').focus();render()}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));fields.forEach(id=>$(id).addEventListener('change',render));$('search').addEventListener('input',render);$('sort').addEventListener('change',render);$('apply').onclick=render;$('clear').onclick=()=>{fields.forEach(id=>$(id).value='');$('search').value='';mode='all';tab='all';render()};$('rows').addEventListener('click',e=>{let s=e.target.closest('[data-save]'),v=e.target.closest('[data-view]');if(s){let id=+s.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);render()}if(v){let car=vehicles.find(x=>x.id===+v.dataset.view);recent=[car.id,...recent.filter(x=>x!==car.id)].slice(0,10);$('modalContent').innerHTML=`<h2>Hyundai ${escapeHtml(car.model)} ${escapeHtml(car.trim)}</h2><p class="muted">Illustrative vehicle record — not verified against live stock.</p><p><strong>${money(car.price)}</strong> · ${car.year} · ${car.miles.toLocaleString()} miles · ${car.fuel} · ${car.trans}</p><h3>Listed features</h3><div class="tags">${car.features.map(f=>`<span class="tag">${escapeHtml(f)}</span>`).join('')}</div><p class="muted">Availability: ${car.status}. Confirm specification, price and availability with your dealership before quoting a customer.</p>`;$('back').classList.add('show')}});$('rows').addEventListener('change',e=>{if(e.target.matches('[data-compare]')){let id=+e.target.dataset.compare;e.target.checked?compared.add(id):compared.delete(id);render()}});$('tabAll').onclick=()=>{tab='all';mode='all';render()};$('tabSaved').onclick=()=>{tab='saved';mode='all';render()};$('tabCompare').onclick=()=>{tab='compare';mode='all';render()};$('close').onclick=()=>$('back').classList.remove('show');$('back').onclick=e=>{if(e.target===$('back'))$('back').classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('back').classList.remove('show')});$('ownerLink').onclick=()=>location.href='owner.html';$('importLink').onclick=()=>location.href='classic.html';$('specLink').onclick=()=>location.href='classic.html';$('helpLink').onclick=()=>{$('modalContent').innerHTML='<h2>SpecTrim support</h2><p>This is the new Sales Assist interface using showcase data. The previous workflow remains available via the management links.</p><p>Live stock, permissions and account authentication must be connected and validated before production use.</p>';$('back').classList.add('show')};populate();render();
</script></body></html>
